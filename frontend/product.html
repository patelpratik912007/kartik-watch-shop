<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buy luxury watches online at Kartik Watch Shop Mehsana. Seiko, Citizen, Tissot, Hamilton, Casio, Orient, Fossil, Swatch with free delivery.">
  <title id="pageTitle">Watch Details — Kartik Watch Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/cart.js" defer></script>
  <script src="js/shared-nav.js" defer></script>
</head>
<body>

  <!-- Breadcrumb -->
  <div class="breadcrumb-bar">
    <div class="container">
      <a href="index.html">Home</a>
      <span class="bc-sep">/</span>
      <a href="collections.html">Collections</a>
      <span class="bc-sep">/</span>
      <span id="bcWatchName">Watch</span>
    </div>
  </div>

  <!-- Product Page -->
  <section class="product-page">
    <div class="container">
      <div class="product-layout" id="productLayout">
        <!-- Filled by JS -->
        <div class="product-loading">
          <div class="loading-spinner"></div>
          <p>Loading timepiece details...</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Related Watches -->
  <section class="related-section">
    <div class="container">
      <div class="section-header">
        <span class="section-subtitle rolex-subtitle">⚜ YOU MAY ALSO LIKE</span>
        <h2 class="section-title">Related <em>Timepieces</em></h2>
      </div>
      <div class="category-grid collections-grid" id="relatedGrid"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom u-pt-lg">
        <p>&copy; <span id="year"></span> Kartik Watch Shop Mehsana. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/watches-data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const yr = document.getElementById('year');
      if (yr) yr.textContent = new Date().getFullYear();

      const params = new URLSearchParams(window.location.search);
      const watchId = parseInt(params.get('id'));
      const watch = WATCH_CATALOG.find(w => w.id === watchId);

      const layout = document.getElementById('productLayout');
      const bcName = document.getElementById('bcWatchName');

      if (!watch) {
        layout.innerHTML = `<div class="product-not-found-box">
          <h2>Watch not found</h2>
          <a href="collections.html" class="btn btn-primary u-mt-md">Back to Collections</a>
        </div>`;
        return;
      }

      document.title = `${watch.name} — Kartik Watch Shop`;
      bcName.textContent = watch.name;

      const mrp = Math.round(watch.price * 1.18 / 100) * 100;
      const discount = Math.round((1 - watch.price / mrp) * 100);
      const fullStars = Math.floor(watch.rating);
      const starsHTML = '★'.repeat(fullStars) + (watch.rating % 1 >= 0.5 ? '½' : '');
      const brandCap = watch.brand.charAt(0).toUpperCase() + watch.brand.slice(1);
      const genderLabel = watch.gender === 'female' ? "Women's" : "Men's";
      const stockText = watch.price > 80000 ? '<span class="stock-badge stock-low">Only 2 left in stock!</span>' : '<span class="stock-badge stock-in">✓ In Stock — Ready to Dispatch</span>';

      layout.innerHTML = `
        <div class="product-gallery">
          <div class="gallery-main">
            <img src="${watch.image}" alt="${watch.name} product photograph" class="product-main-img" decoding="async" fetchpriority="high">
          </div>
          <p class="product-gallery-caption"><span>Official catalogue visual</span><span>Reference #KWS-${String(watch.id).padStart(3, '0')}</span></p>
        </div>

        <div class="product-info">
          <div class="product-badge-row">
            <span class="card-badge rolex-badge product-badge-static">${watch.badge}</span>
            <span class="product-brand-tag">${brandCap} • ${genderLabel}</span>
          </div>
          <h1 class="product-title">${watch.name}</h1>
          <div class="product-rating-row">
            <span class="stars-gold">${starsHTML}</span>
            <span class="rating-num">${watch.rating.toFixed(1)} / 5.0</span>
            <span class="rating-count">• 128 reviews</span>
          </div>
          <div class="product-price-block">
            <span class="product-mrp">M.R.P: ₹${mrp.toLocaleString('en-IN')}</span>
            <div class="product-price-row">
              <span class="product-price">₹${watch.price.toLocaleString('en-IN')}</span>
              <span class="price-discount-badge">-${discount}% OFF</span>
            </div>
            <span class="product-inclusive">Inclusive of all taxes</span>
          </div>

          ${stockText}

          <div class="product-specs-table">
            <h3 class="specs-heading">Technical Specifications</h3>
            <table>
              <tr><td>Brand</td><td><strong>${brandCap}</strong></td></tr>
              <tr><td>Model</td><td><strong>${watch.name}</strong></td></tr>
              <tr><td>Specifications</td><td><strong>${watch.specs}</strong></td></tr>
              <tr><td>Gender</td><td><strong>${genderLabel}</strong></td></tr>
              <tr><td>Collection</td><td><strong>${watch.category.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}</strong></td></tr>
              <tr><td>Warranty</td><td><strong>2-Year Kartik Atelier Warranty</strong></td></tr>
              <tr><td>Delivery</td><td><strong>Free • 3–5 business days</strong></td></tr>
            </table>
          </div>

          <p class="product-desc-text">${watch.desc} Available exclusively at Kartik Watch Shop, Radhanpur Road, Mehsana, Gujarat.</p>

          <div class="product-qty-row">
            <label for="productQty">Qty:</label>
            <div class="qty-controls">
              <button id="qtyMinus" onclick="adjustQty(-1)">−</button>
              <input type="number" id="productQty" value="1" min="1" max="10" readonly>
              <button id="qtyPlus" onclick="adjustQty(1)">+</button>
            </div>
          </div>

          <div class="product-action-btns">
            <button id="addToCartBtn" class="btn-product-cart" onclick="addToCart()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
              Add to Cart
            </button>
            <button class="btn-product-buy" onclick="buyNow()">
              ⚡ Buy Now
            </button>
          </div>

          <div class="product-assurances">
            <div class="assurance-item"><span>🔒</span><span>Secure Payment</span></div>
            <div class="assurance-item"><span>🚚</span><span>Free Delivery</span></div>
            <div class="assurance-item"><span>✅</span><span>Genuine Certified</span></div>
            <div class="assurance-item"><span>↩️</span><span>7-Day Returns</span></div>
          </div>

          <div class="product-sell-link product-tradein-box">
            <div class="product-tradein-row">
              <span>✒️</span> <span>Complimentary case-back laser engraving available. <a href="services.html#services" class="product-tradein-link">Learn More &rarr;</a></span>
            </div>
            <div class="product-tradein-row">
              <span>🛠️</span> <span>Lifetime care &amp; maintenance support available. <a href="services.html" class="product-tradein-link">Explore Horology Services &rarr;</a></span>
            </div>
            <div class="product-tradein-row">
              <span>💰</span> <span>Have a luxury watch to trade in towards this piece? <a href="sell.html" class="product-tradein-link">Get Instant Valuation &rarr;</a></span>
            </div>
          </div>
        </div>
      `;

      // Render related watches (same brand, excluding current)
      const relatedGrid = document.getElementById('relatedGrid');
      const related = WATCH_CATALOG.filter(w => w.brand === watch.brand && w.id !== watch.id).slice(0, 4);
      related.forEach(r => {
        const rMrp = Math.round(r.price * 1.15 / 100) * 100;
        const rDisc = Math.round((1 - r.price / rMrp) * 100);
        const card = document.createElement('article');
        card.className = 'collection-card rolex-style-card amz-card';
        card.innerHTML = `
          <a href="product.html?id=${r.id}" class="card-image-link">
            <div class="card-image-wrap">
              <div class="card-pedestal-light"></div>
              <img src="${r.image}" alt="${r.name}" class="card-img" loading="lazy">
              <div class="card-badge rolex-badge">${r.badge}</div>
            </div>
          </a>
          <div class="card-body">
            <a href="product.html?id=${r.id}" class="card-title-link"><h3 class="card-title">${r.name}</h3></a>
            <div class="card-price-row">
              <div class="price-block">
                <span class="price-mrp">₹${rMrp.toLocaleString('en-IN')}</span>
                <span class="price-discount">-${rDisc}%</span>
                <span class="price-val">₹${r.price.toLocaleString('en-IN')}</span>
              </div>
            </div>
            <div class="card-amz-actions">
              <button class="btn-add-cart" data-id="${r.id}">Add to Cart</button>
              <a href="product.html?id=${r.id}" class="btn-buy-now">Buy Now</a>
            </div>
          </div>`;
        relatedGrid.appendChild(card);
      });

      relatedGrid.querySelectorAll('.btn-add-cart').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const w2 = WATCH_CATALOG.find(x => x.id === id);
          if (w2 && typeof KartikCart !== 'undefined') KartikCart.addItem(w2);
        });
      });
    });

    function adjustQty(delta) {
      const input = document.getElementById('productQty');
      const val = parseInt(input.value) + delta;
      if (val >= 1 && val <= 10) input.value = val;
    }

    function addToCart() {
      const params = new URLSearchParams(window.location.search);
      const watchId = parseInt(params.get('id'));
      const watch = WATCH_CATALOG.find(w => w.id === watchId);
      const qty = parseInt(document.getElementById('productQty').value);
      if (watch && typeof KartikCart !== 'undefined') {
        KartikCart.addItem(watch, qty);
        const btn = document.getElementById('addToCartBtn');
        btn.textContent = '✓ Added to Cart!';
        btn.style.background = 'var(--rolex-green)';
        setTimeout(() => {
          btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Add to Cart`;
          btn.style.background = '';
        }, 2500);
      }
    }

    function buyNow() {
      addToCart();
      setTimeout(() => { window.location.href = 'cart.html'; }, 400);
    }
  </script>
</body>
</html>
